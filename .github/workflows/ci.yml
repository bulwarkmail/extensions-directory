name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major version as the server (mail.rath.li), so the
          # better-sqlite3 binary matches.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # The build imports the database client; give it a throwaway file.
          DATABASE_PATH: ${{ runner.temp }}/build.db
          UPLOADS_DIR: ${{ runner.temp }}/uploads
          NEXT_TELEMETRY_DISABLED: 1
